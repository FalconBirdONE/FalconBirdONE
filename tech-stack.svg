<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 46" width="100%" height="46" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .tech {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic Pro', 'Yu Gothic', Meiryo, sans-serif;
      font-size: 17px;
      fill: #b7b7d1;
      letter-spacing: 0.5px;
    }
    .dot {
      fill: #6d6d8a;
    }
  </style>

  <defs>
    <clipPath id="clip">
      <rect x="0" y="0" width="1860" height="46" />
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <g id="track">
      <!-- set 1 -->
      <g transform="translate(0,0)">
        <text x="0" y="29" class="tech">TypeScript / <tspan fill="#f4ff1a">タイプスクリプト</tspan></text>
        <circle cx="273" cy="23" r="2.5" class="dot"/>
        <text x="293" y="29" class="tech">React Native / <tspan fill="#ff2ee6">リアクトネイティブ</tspan></text>
        <circle cx="601" cy="23" r="2.5" class="dot"/>
        <text x="621" y="29" class="tech">Python / <tspan fill="#39ff6b">パイソン</tspan></text>
        <circle cx="790" cy="23" r="2.5" class="dot"/>
        <text x="810" y="29" class="tech">C/C++ / <tspan fill="#f4ff1a">シープラスプラス</tspan></text>
        <circle cx="1038" cy="23" r="2.5" class="dot"/>
        <text x="1058" y="29" class="tech">Java / <tspan fill="#ff2ee6">ジャバ</tspan></text>
        <circle cx="1192" cy="23" r="2.5" class="dot"/>
        <text x="1212" y="29" class="tech">SQL / <tspan fill="#39ff6b">エスキューエル</tspan></text>
        <circle cx="1405" cy="23" r="2.5" class="dot"/>
        <text x="1425" y="29" class="tech">Next.js / <tspan fill="#f4ff1a">ネクストジェイエス</tspan></text>
        <circle cx="1688" cy="23" r="2.5" class="dot"/>
        <text x="1708" y="29" class="tech">Git / <tspan fill="#ff2ee6">ギット</tspan></text>
      </g>
      <!-- set 2 (seamless repeat, offset by full loop width) -->
      <g transform="translate(1860,0)">
        <text x="0" y="29" class="tech">TypeScript / <tspan fill="#f4ff1a">タイプスクリプト</tspan></text>
        <circle cx="273" cy="23" r="2.5" class="dot"/>
        <text x="293" y="29" class="tech">React Native / <tspan fill="#ff2ee6">リアクトネイティブ</tspan></text>
        <circle cx="601" cy="23" r="2.5" class="dot"/>
        <text x="621" y="29" class="tech">Python / <tspan fill="#39ff6b">パイソン</tspan></text>
        <circle cx="790" cy="23" r="2.5" class="dot"/>
        <text x="810" y="29" class="tech">C/C++ / <tspan fill="#f4ff1a">シープラスプラス</tspan></text>
        <circle cx="1038" cy="23" r="2.5" class="dot"/>
        <text x="1058" y="29" class="tech">Java / <tspan fill="#ff2ee6">ジャバ</tspan></text>
        <circle cx="1192" cy="23" r="2.5" class="dot"/>
        <text x="1212" y="29" class="tech">SQL / <tspan fill="#39ff6b">エスキューエル</tspan></text>
        <circle cx="1405" cy="23" r="2.5" class="dot"/>
        <text x="1425" y="29" class="tech">Next.js / <tspan fill="#f4ff1a">ネクストジェイエス</tspan></text>
        <circle cx="1688" cy="23" r="2.5" class="dot"/>
        <text x="1708" y="29" class="tech">Git / <tspan fill="#ff2ee6">ギット</tspan></text>
      </g>

      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="translate"
        from="0 0"
        to="-1860 0"
        dur="22s"
        repeatCount="indefinite" />
    </g>
  </g>
</svg>
